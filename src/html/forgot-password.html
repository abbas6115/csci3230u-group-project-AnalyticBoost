<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Naviscope - Forgot Password</title>
        <link rel="stylesheet" href="../styles/style.css"/>         <!-- general website styling -->
        <link rel="stylesheet" href="../styles/login-styles.css">   <!-- page-specific login styles -->
    </head>
    <body>
        <!-- Website header -->
        <header class="site-header">
            <a class="website-brand" href="/src/html/index.html">Naviscope</a>
        </header>

        <main>
            <div class="item-detail-body auth-container">
                <section class="auth-header">
                    <h1>Reset Password</h1>
                    <p>Enter your e-mail address below and we'll send you instructions to reset your password.</p>
                </section>

                <form class="auth-form" action="#" method="post">
                    <div class="form-group">
                        <label for="Email">E-mail Address</label>
                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="person@example.com"
                               required
                        >
                    </div>

                    <button type="submit" class="auth-button">Send Reset Link</button>

                    <div class="auth-footer">
                        <a href="login-page.html" class="back-link">
                            &larr; Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </main>
        
    </body>
</html>
