<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Naviscape - Item Details Template</title>
        <link rel="stylesheet" href="../styles/style.css"/>
    </head>
    <body>
        <!-- Website header -->
        <header class="site-header">
            <a class="website-brand" href="index.html">Naviscape</a>
            <nav id="site-navigation" class="site-navigation" aria-label="Main navigation">
                <a class="button-login" href=login-page.html aria-hidden="true">Log In</a>
            </nav>
        </header>

        <main>
            <div class="item-detail-body">

                <section class="attraction-details">
                    <!-- Name of Attraction -->
                    <h1 class="attraction-name">Sample Text</h1>

                    <!-- Image of Attraction -->
                    <img src="../../images/grass-field.jpg" alt="image showing a grassy landscape">

                    <article class="location-details">
                        <!-- Location address -->
                        <p></p>
                        <!--Plus Code  -->
                        <p></p>
                        <!-- Additional information -->
                        <p></p>
                    </article>
                    <button>Favourite</button>
                </section>
                
                <!-- Reviews list -->
                <section class="review">
                <h3>Reviews</h3>
                <ul class="review-list">
                    <li>
                        <article>
                            <!-- User -->
                            <p>Anonymous</p>
                            <!-- Review -->
                            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Asperiores sed minima dolorum possimus ipsum doloremque impedit! Excepturi odio ipsum quos beatae alias fugiat rerum maiores itaque quo porro. Facilis, quisquam?</p>
                        </article>
                    </li>
                </ul>
                </section>
            </div>
            
            <div class="bottom-city-fader">
                <img src="../../images/city-background.png" alt="City Skyline Background" class="faded-city-img">
            </div>
        </main>
    </body>
</html>
