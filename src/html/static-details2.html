<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Naviscape</title>
        <link rel="stylesheet" href="../styles/style.css">
    </head>
    <body>
        <!-- Website header -->
        <header class="site-header">
            <a class="website-brand" href="index.html">Naviscape</a>
            <nav id="site-navigation" class="site-navigation" aria-label="Main navigation">
                <a class="button-login" href=login-page.html aria-hidden="true">Log In</a>
            </nav>
        </header>

        <main>
            <div class="item-detail-body">

                <section class="attraction-details">
                    <!-- Name of Attraction -->
                    <h1 class="attraction-name">Ontario Tech University</h1>

                    <!-- Image of Attraction -->
                    <img src="../../images/MemorialPark.jpg" alt="image showing a building in ontario tech university">

                    <article class="location-details">
                        <!-- Location address -->
                        <p>111 Dundas St E, Whitby, ON L1N 4C8</p>
                        <!-- Additional information -->
                    </article>
                    <div>
                        <button class="favourite-button">Favourite</button>
                        <button class="review">Review</button>
                    </div>
                </section>
                
                <!-- Reviews list -->
                <section class="review">
                <h2>Reviews</h2>
                <ul class="review-list">
                    <li>
                        <article>
                            <!-- User -->
                            <p>Anonymous</p>
                            <!-- Review -->
                            <p>Very beautiful place</p>
                        </article>
                    </li>
                </ul>
                </section>
            </div>

            <div class="bottom-city-fader">
                <img src="../../images/city-background.png" alt="City Skyline Background" class="faded-city-img">
            </div>
        </main>
    </body>
</html>
